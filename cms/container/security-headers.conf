# Eén add_header in een location-blok zet alle geërfde headers uit, dus dit
# bestand wordt in ieder blok met eigen headers opnieuw geïnclude.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
# Met 'same-origin' verliest de OAuth-popup zijn opener en blijft de login hangen.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Zonder 'unsafe-eval' en zonder unpkg.com in connect-src blijft de CMS hangen
# op een laadscherm, zonder console-fout: unpkg levert de syntax-highlighter en
# de versiecheck. cdn.jsdelivr.net levert alleen fonts en mag weg.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.githubusercontent.com; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://api.github.com https://github.com https://*.githubusercontent.com https://www.githubstatus.com https://cdn.jsdelivr.net https://unpkg.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
