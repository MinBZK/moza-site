name: Toon

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TOON_SITE: moza/website
  TOON_ORIGIN: https://toon.rijks.app
  PREVIEW_REF: pr-${{ github.event.pull_request.number }}
  SITE_PATH: moza/website/_preview/pr-${{ github.event.pull_request.number }}
  PANDOC_VERSION: "3.11"
  PANDOC_SHA256: 37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6

jobs:
  publish:
    # Bots krijgen geen OIDC-token; de action slaat ze toch over.
    if: github.event.action != 'closed' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Hugo
        uses: ./.github/actions/setup-hugo

      - name: Install pandoc
        working-directory: ${{ runner.temp }}
        run: |
          curl -sLo pandoc.tar.gz "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          echo "${PANDOC_SHA256}  pandoc.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf pandoc.tar.gz --strip-components=2 -C "${HOME}/.local/bin" "pandoc-${PANDOC_VERSION}/bin/pandoc"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Render Mermaid SVGs
        run: npm run render-mermaid

      # De site landt in tmp/toon/<pad op Toon>, zodat render-downloads met
      # tmp/toon als webroot dezelfde URL's ziet als een bezoeker op Toon.
      - name: Build site
        run: |
          hugo --minify --baseURL "${TOON_ORIGIN}/${SITE_PATH}/" \
            --destination "tmp/toon/${SITE_PATH}" --buildDrafts
          cp "tmp/toon/${SITE_PATH}/download.json" tmp/toon/

      - name: Genereer de downloads
        run: npm run render-downloads -- tmp/toon

      - name: Genereer de deelafbeeldingen
        run: npm run og-cards -- "tmp/toon/${SITE_PATH}"

      # Bouwsteiger voor de twee stappen hierboven; hoort niet online.
      - name: Ruim de manifesten op
        run: rm tmp/toon/download.json "tmp/toon/${SITE_PATH}/download.json" "tmp/toon/${SITE_PATH}/og.json"

      - name: Publiceer preview
        uses: DigiGilde/toon/actions/publish@3c0427f19f9ea7e367d9f6574e74d51fd789d0d7 # v2026.11.4
        with:
          site: ${{ env.TOON_SITE }}
          dist-path: tmp/toon/${{ env.SITE_PATH }}
          preview-ref: ${{ env.PREVIEW_REF }}
          environment: toon-preview
          comment-on-pr: true

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      deployments: write
      pull-requests: write
    steps:
      - name: Verwijder preview
        uses: DigiGilde/toon/actions/publish@3c0427f19f9ea7e367d9f6574e74d51fd789d0d7 # v2026.11.4
        with:
          site: ${{ env.TOON_SITE }}
          preview-ref: ${{ env.PREVIEW_REF }}
          teardown: true
          environment: toon-preview
          comment-on-pr: true
