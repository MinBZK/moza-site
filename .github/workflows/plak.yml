name: Plak

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PLAK_SITE: moza/website
  PLAK_ORIGIN: https://plak.rijks.app
  PREVIEW_REF: pr-${{ github.event.pull_request.number }}
  SITE_PATH: moza/website/_preview/pr-${{ github.event.pull_request.number }}
  HUGO_VERSION: 0.166.0
  HUGO_SHA256: 45228f5a52eb118b0ca168068f01d7df0447314a24056f1d29667ed9fc368308
  PANDOC_VERSION: "3.11"
  PANDOC_SHA256: 37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6

jobs:
  publish:
    # Bots krijgen geen OIDC-token; de action slaat ze toch over.
    if: github.event.action != 'closed' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Hugo en pandoc
        working-directory: ${{ runner.temp }}
        run: |
          curl -sLo hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum -c -
          curl -sLo pandoc.tar.gz "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          echo "${PANDOC_SHA256}  pandoc.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf hugo.tar.gz -C "${HOME}/.local/bin" hugo
          tar -xzf pandoc.tar.gz --strip-components=2 -C "${HOME}/.local/bin" "pandoc-${PANDOC_VERSION}/bin/pandoc"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Render Mermaid SVGs
        run: npm run render-mermaid

      # De site landt in tmp/plak/<pad op Plak>, zodat render-downloads met
      # tmp/plak als webroot dezelfde URL's ziet als een bezoeker op Plak.
      - name: Build site
        run: |
          hugo --minify --baseURL "${PLAK_ORIGIN}/${SITE_PATH}/" \
            --destination "tmp/plak/${SITE_PATH}" --buildDrafts
          cp "tmp/plak/${SITE_PATH}/download.json" tmp/plak/

      - name: Genereer de downloads
        run: npm run render-downloads -- tmp/plak

      - name: Genereer de deelafbeeldingen
        run: npm run og-cards -- "tmp/plak/${SITE_PATH}"

      # Bouwsteiger voor de twee stappen hierboven; hoort niet online.
      - name: Ruim de manifesten op
        run: rm tmp/plak/download.json "tmp/plak/${SITE_PATH}/download.json" "tmp/plak/${SITE_PATH}/og.json"

      - name: Publiceer preview
        uses: DigiGilde/plak/actions/publish@792a00fc60e47aed50db761dd93d62d8d483bd47 # v2026.10.7
        with:
          site: ${{ env.PLAK_SITE }}
          dist-path: tmp/plak/${{ env.SITE_PATH }}
          preview-ref: ${{ env.PREVIEW_REF }}
          environment: plak-preview
          comment-on-pr: true

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      deployments: write
      pull-requests: write
    steps:
      - name: Verwijder preview
        uses: DigiGilde/plak/actions/publish@792a00fc60e47aed50db761dd93d62d8d483bd47 # v2026.10.7
        with:
          site: ${{ env.PLAK_SITE }}
          preview-ref: ${{ env.PREVIEW_REF }}
          teardown: true
          environment: plak-preview
          comment-on-pr: true
