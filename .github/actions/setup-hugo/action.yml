name: Setup Hugo
description: Installeert Hugo (linux-amd64) met een sha256-controle.

inputs:
  version:
    description: Hugo-versie, gelijk aan die in container/Containerfile.
    default: "0.166.0"
  sha256:
    description: sha256 van hugo_<versie>_linux-amd64.tar.gz; hoort bij de versie.
    default: "45228f5a52eb118b0ca168068f01d7df0447314a24056f1d29667ed9fc368308"

runs:
  using: composite
  steps:
    - name: Install Hugo
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        HUGO_VERSION: ${{ inputs.version }}
        HUGO_SHA256: ${{ inputs.sha256 }}
      run: |
        curl -sLo hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
        echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum -c -
        mkdir -p "${HOME}/.local/bin"
        tar -xzf hugo.tar.gz -C "${HOME}/.local/bin" hugo
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
        "${HOME}/.local/bin/hugo" version
