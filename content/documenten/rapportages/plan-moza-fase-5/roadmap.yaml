intro: >-
  De roadmap laat per onderdeel zien wat we verkennen en realiseren. Hij
  sluit aan op de eerder opgestelde roadmap van MOZa. Die is daarna
  uitgewerkt in de roadmap van MijnOverheid, die elk kwartaal in het
  Routekaartoverleg wordt gedeeld. Het is geen vastgestelde planning, maar
  de roadmap helpt bij het prioriteren en plannen. Bij onderdelen met
  (Logius) ligt de realisatie bij Logius en draagt MOZa bij, bijvoorbeeld
  aan het deel voor ondernemers. Fase 5 van MOZa loopt van oktober 2026
  t/m januari 2027.
caption: "Roadmap MOZa per kwartaal, van het vierde kwartaal van 2026 t/m het derde kwartaal van 2027"
