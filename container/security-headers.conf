# Eén add_header in een location-blok zet alle geërfde headers uit, dus dit
# bestand wordt in ieder blok met eigen headers opnieuw geïnclude.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Origin-Agent-Cluster "?1" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self';" always;
# includeSubDomains omdat al onze sites over https gaan. Bewust geen preload:
# dat is alleen via de browserlijst terug te draaien.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
