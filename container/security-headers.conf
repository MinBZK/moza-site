# Eén add_header in een location-blok zet alle geërfde headers uit, dus dit
# bestand wordt in ieder blok met eigen headers opnieuw geïnclude.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self';" always;
add_header Strict-Transport-Security "max-age=31536000" always;
