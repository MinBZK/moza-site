[project]
name = "moza-weekly"
version = "0.2.0"
description = "Verzamelt Mattermost-input voor de MOZa Weekly en rendert die naar YAML, JSON en HTML"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "jinja2>=3",
    "markdown-it-py>=3",
    "pyyaml>=6",
    "tenacity>=8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
