pre-commit:
  commands:
    stille-terugdraai:
      run: npm run --silent terugdraai
    rapport-versie:
      run: npm run --silent rapport-versie
    hugo-build:
      run: rm -rf public && hugo --minify --logLevel warn
    htmltest:
      run: rm -rf tmp/public && HUGO_PARAMS_LINKCONTROLE=true hugo --minify --quiet --baseURL / --destination tmp/public && htmltest && rm -rf tmp/public
