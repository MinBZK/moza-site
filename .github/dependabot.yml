version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Mermaid 12 verandert de standaard-layout (ELK), de look (neo) en
      # flowchart.wrappingWidth, waardoor elk gerenderd diagram verschuift.
      # Zie issue #179; tot die tijd blijven we op 11.
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/container"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/cms/container"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/scripts/moza-weekly"
    schedule:
      interval: "weekly"
