<svg viewBox="0 30 1420 885" role="img" aria-labelledby="cpDgTitle cpDgDesc" xmlns="http://www.w3.org/2000/svg">
  <title id="cpDgTitle">Componenten in samenhang, versie 1</title>
  <desc id="cpDgDesc">{{ if .stappen }}De plaat heeft twee zones. Links de zone Dienstverlener, rechts de zone Centraal. Bovenaan, buiten de zones, staat een persoon. Die heeft een verbinding in twee richtingen met het overheidsportaal in de zone Centraal. In de zone Centraal staan drie blokken. Het blok Profieldienst bevat de profielservice en de verificatieservice. Het blok Berichtenbox (BBO) bevat het onderdeel voor burgers en ondernemers. Het blok Notificatiedienst bevat de Notificatie Management Component (NMC), NotifyNL, Contactherstel en de Printstraat. In de zone Dienstverlener staan onder elkaar de procesapplicatie, de OMC en het berichtenmagazijn. De procesapplicatie stuurt naar de OMC. De OMC stuurt naar het berichtenmagazijn, naar de Berichtenbox en naar de NMC. De NMC stuurt naar NotifyNL, en NotifyNL verstuurt e-mail. Een rode lijn met het label "Niet bezorgd" loopt van de e-mail via NotifyNL terug naar de NMC. Dat is een technisch signaal dat de e-mail niet aankwam, geen bericht aan de ondernemer. De NMC stuurt dan naar Contactherstel, Contactherstel naar de Printstraat, en de Printstraat verstuurt een brief. De lijnen van de e-mail en de brief komen samen en lopen naar de persoon bovenaan.{{ else }}De plaat heeft twee zones. Links de zone Dienstverlener, rechts de zone Centraal. Elk onderdeel heeft een kleur die de status aangeeft: in aanbouw, verkenning, beschikbaar of aandachtspunt. Bij de meeste onderdelen staat ook het team dat eraan werkt. Bovenaan, buiten de zones, staat een persoon. Die heeft een verbinding in twee richtingen met het overheidsportaal in de zone Centraal. Het overheidsportaal heeft geen status en geen team. In de zone Centraal staan drie blokken. Het blok Profieldienst bevat de profielservice (aandachtspunt, Team MOZa) en de verificatieservice (in aanbouw, Team MOZa). Het overheidsportaal heeft met allebei een verbinding in twee richtingen, en de profielservice stuurt gegevens naar de verificatieservice. Het blok Berichtenbox (BBO) bevat het onderdeel voor burgers en ondernemers (in aanbouw, Team BBO). Het blok Notificatiedienst bevat vier onderdelen: de Notificatie Management Component (in aanbouw, Team MOZa), NotifyNL (in aanbouw, Team Noto), Contactherstel (aandachtspunt, Team Geel) en de Printstraat (beschikbaar, Team Geel). Verbindingen in twee richtingen lopen tussen de profielservice en de Notificatie Management Component, tussen de verificatieservice en NotifyNL, tussen de Notificatie Management Component en NotifyNL, tussen de Notificatie Management Component en Contactherstel, en tussen Contactherstel en de Printstraat. In de zone Dienstverlener staan drie onderdelen onder elkaar. Onderaan de procesapplicatie, zonder status en zonder team. Daarboven de OMC, zonder status en zonder team. Bovenaan het berichtenmagazijn (verkenning, Team MOZa en Logius). De procesapplicatie stuurt naar de OMC en de OMC stuurt naar het berichtenmagazijn. De OMC stuurt daarnaast naar de Notificatie Management Component en naar de Berichtenbox. Het overheidsportaal leest uit het berichtenmagazijn en heeft een verbinding in twee richtingen met de Berichtenbox. Rechts verstuurt NotifyNL e-mail en verstuurt de Printstraat brieven. Die twee lijnen komen samen en lopen naar de persoon bovenaan.{{ end }}{{ if .stappen }} Bij de pijl van de OMC naar het berichtenmagazijn staat "Optie A: lokaal plaatsen", bij de pijl van de OMC naar de Berichtenbox "Optie B: centraal plaatsen". Bij de gekozen stap staat bij de pijlen ook het type bericht: inhoudelijk bericht, kennisgeving (melding), attendering of contactherstelmelding.{{ end }}</desc>

    {{- if .stappen }}

    </marker>

      <path class="cp-dg-arrow-head-fout" d="M0 0 L10 5 L0 10 z"/>

    {{- end }}

  <path class="cp-dg-arrow"{{ if .stappen }} data-stappen=""{{ end }} d="M800 248 L527 248 L527 326" marker-start="url(#cp-arrow)" marker-end="url(#cp-arrow)"/>
