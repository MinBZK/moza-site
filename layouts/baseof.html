<!doctype html>
<html lang="nl">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a href="#main-content" class="skip-link">Ga naar de inhoud</a>
    {{ partial "header.html" . }}
    <main id="main-content" tabindex="-1">
      <button id="highlight-bar" class="toast" aria-live="polite" hidden>
        Zoekterm "<span id="highlight-bar-query"></span>" is gemarkeerd. Klik hier om de markering te verwijderen.
      </button>
      {{- block "main" . }}{{ end -}}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "search.html" . }}
    {{ partial "scripts.html" . }}
  </body>
</html>
