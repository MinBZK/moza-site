name: Production build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Eén build, die getest, gescand en daarna precies zo gepusht wordt: een
      # tweede build zou de runtime-stage (no-cache-filters) opnieuw upgraden.
      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./container/Containerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_URL=https://mijnoverheidzakelijk.nl
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Anders kan de apk-upgrade in de runtime-stage uit een oude cache komen.
          no-cache-filters: runtime

      - name: Test nginx in de container
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: container/test-nginx.sh "$(head -n 1 <<< "$TAGS")"

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push container image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            docker push "$tag"
          done <<< "$TAGS"
